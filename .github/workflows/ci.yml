name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 -m unittest discover -s tests/mcp_v2 -t tests/mcp_v2
      - run: python3 -m unittest discover -s tests/scripts -t tests/scripts
      - run: python3 scripts/tilth-bash-guard --self-test

  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmark/requirements*.txt
      - run: python -m pip install -r benchmark/requirements-dev.txt
      - run: python -m pytest benchmark/tests -q

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
      - uses: nosborn/github-action-markdown-cli@9b5e871c11cc0649c5ac2526af22e23525fa344d # ratchet:nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: prompts/ AGENTS.md
          config_file: .markdownlint.json
      - name: AGENTS.md is regenerated from prompts/
        # Re-running the regen script must be a no-op. If AGENTS.md drifts from
        # prompts/*.md (someone edited the markdown but forgot to re-run the
        # script), this step fails and surfaces the missing regen in the PR.
        run: bash ./scripts/regen-agents-md.sh && git diff --exit-code AGENTS.md
