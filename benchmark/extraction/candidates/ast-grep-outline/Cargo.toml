[package]
name = "ast-grep-outline-candidate"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ast-grep-outline-candidate"
path = "src/main.rs"

[dependencies]
ast-grep-outline = "=0.45.3"
ast-grep-config = "=0.45.3"
ast-grep-core = "=0.45.3"
ast-grep-language = "=0.45.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = "2.1.2"
clap = { version = "4", features = ["derive"] }
