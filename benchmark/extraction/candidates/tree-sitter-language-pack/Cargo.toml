[package]
name = "tsl-pack-candidate"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tsl-pack-candidate"
path = "src/main.rs"

[dependencies]
tree-sitter-language-pack = "=1.17.0"
tree-sitter = "=0.26.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = "2.1.2"
clap = { version = "4", features = ["derive"] }
